<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft 2D Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="world"></div>
  <div class="inventory">
    <div class="inventory-title">Inventory</div>
    <button  class="restart-button">Restart</button>
    <button  class="inventory-item wood">
      <span class="label">Wood</span>
      <span class="count">0</span>
    </button>
    <button  class="inventory-item leaves">
      <span class="label">Leaves</span>
      <span class="count">0</span>
    </button>
    
    <button  class="inventory-item grass">
      <span class="label">Grass</span>
      <span class="count">0</span>
    </button>
    <button type="button" class="inventory-item dirt">
      <span class="label">Dirt</span>
      <span class="count">0</span>
    </button>
    <button type="button" class="inventory-item coal">
      <span class="label">Coal</span>
      <span class="count">0</span>
    </button>
    <button  class="inventory-item stone">
      <span class="label">Stone</span>
      <span class="count">0</span>
    </button>
     
    <button  class="inventory-item dim">
      <span class="label">Dimond</span>
      <span class="count">0</span>
    </button>
    <button  class="inventory-item iron">
      <span class="label">Iron</span>
      <span class="count">0</span>
    </button>
    <button  class="inventory-item axe" id="axe-button">
      <span class="label">Axe</span>
    </button>
    <button  class="inventory-item shovel" id="shovel-button">
      <span class="label">Shovel</span>
    </button>
    <button  class="inventory-item pickaxe" id="pickaxe-button">
      <span class="label">Pickaxe</span>
    </button>
    
  </div>
  
<script src="script.js"></script>
</body>
</html>
